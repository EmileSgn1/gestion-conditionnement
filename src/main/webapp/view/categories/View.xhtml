<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewCategoriesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewCategoriesLabel_nom}"/>
                    <h:outputText value="#{not empty categoriesController.selected.nom ? categoriesController.selected.nom : '—'}" title="#{bundle.ViewCategoriesTitle_nom}" />
                    <h:outputText value="#{bundle.ViewCategoriesLabel_description}"/>
                    <h:outputText value="#{not empty categoriesController.selected.description ? categoriesController.selected.description : '—'}" title="#{bundle.ViewCategoriesTitle_description}" />
                    <h:outputText value="#{bundle.ViewCategoriesLabel_actif}"/>
                    <h:outputText value="#{categoriesController.selected.actif ? 'Oui' : 'Non'}" title="#{bundle.ViewCategoriesTitle_actif}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{categoriesController.destroyAndView}" value="#{bundle.ViewCategoriesDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewCategoriesEditLink}"/>
                <br />
                <h:commandLink action="#{categoriesController.prepareCreate}" value="#{bundle.ViewCategoriesCreateLink}" />
                <br />
                <h:commandLink action="#{categoriesController.prepareList}" value="#{bundle.ViewCategoriesShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>

</html>
