<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateCategoriesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateCategoriesLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{categoriesController.selected.nom}" title="#{bundle.CreateCategoriesTitle_nom}" required="true" requiredMessage="#{bundle.CreateCategoriesRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.CreateCategoriesLabel_description}" for="description" />
                    <h:inputText id="description" value="#{categoriesController.selected.description}" title="#{bundle.CreateCategoriesTitle_description}" />
                    <h:outputLabel value="#{bundle.CreateCategoriesLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox id="actif" value="#{categoriesController.selected.actif}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{categoriesController.create}" value="#{bundle.CreateCategoriesSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{categoriesController.prepareList}" value="#{bundle.CreateCategoriesShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
