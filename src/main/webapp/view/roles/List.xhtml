<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListRolesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar"><h:commandLink action="#{rolesController.prepareCreate}" value="#{bundle.ListRolesCreateLink}" styleClass="btn-primary"/></div>
                <h:panelGroup layout="block" styleClass="empty-state" rendered="#{rolesController.items.rowCount == 0}"><h:outputText escape="false" value="#{bundle.ListRolesEmpty}"/></h:panelGroup>
                <h:panelGroup rendered="#{rolesController.items.rowCount > 0}">
                    <h:outputText value="Affichage de #{rolesController.pagination.pageFirstItem + 1} à #{rolesController.pagination.pageLastItem + 1} sur #{rolesController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{rolesController.previous}" value="#{bundle.Previous} #{rolesController.pagination.pageSize}" rendered="#{rolesController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{rolesController.next}" value="#{bundle.Next} #{rolesController.pagination.pageSize}" rendered="#{rolesController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{rolesController.items}" var="item" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" styleClass="modern-table">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRolesTitle_nom}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.nom ? item.nom : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListRolesTitle_description}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.description ? item.description : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Actions"/>
                            </f:facet>
                            <h:commandLink action="#{rolesController.prepareView}" value="#{bundle.ListRolesViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{rolesController.prepareEdit}" value="#{bundle.ListRolesEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{rolesController.destroy}" onclick="return confirm('Confirmer la suppression de cet élément ?');" value="#{bundle.ListRolesDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
