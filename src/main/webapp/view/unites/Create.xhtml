<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateUnitesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateUnitesLabel_code}" for="code" />
                    <h:inputText id="code" value="#{unitesController.selected.code}" title="#{bundle.CreateUnitesTitle_code}" required="true" requiredMessage="#{bundle.CreateUnitesRequiredMessage_code}"/>
                    <h:outputLabel value="#{bundle.CreateUnitesLabel_sigle}" for="sigle" />
                    <h:inputText id="sigle" value="#{unitesController.selected.sigle}" title="#{bundle.CreateUnitesTitle_sigle}" />
                    <h:outputLabel value="#{bundle.CreateUnitesLabel_libelle}" for="libelle" />
                    <h:inputText id="libelle" value="#{unitesController.selected.libelle}" title="#{bundle.CreateUnitesTitle_libelle}" required="true" requiredMessage="#{bundle.CreateUnitesRequiredMessage_libelle}"/>
                    <h:outputLabel value="#{bundle.CreateUnitesLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{unitesController.selected.nom}" title="#{bundle.CreateUnitesTitle_nom}" required="true" requiredMessage="#{bundle.CreateUnitesRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.CreateUnitesLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox id="actif" value="#{unitesController.selected.actif}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{unitesController.create}" value="#{bundle.CreateUnitesSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{unitesController.prepareList}" value="#{bundle.CreateUnitesShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
