<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewHistoriqueTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_action}"/>
                    <h:outputText value="#{not empty historiqueController.selected.action ? historiqueController.selected.action : '—'}" title="#{bundle.ViewHistoriqueTitle_action}" />
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_details}"/>
                    <h:outputText value="#{not empty historiqueController.selected.details ? historiqueController.selected.details : '—'}" title="#{bundle.ViewHistoriqueTitle_details}" />
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_dateAction}"/>
                    <h:outputText value="#{historiqueController.selected.dateAction}" title="#{bundle.ViewHistoriqueTitle_dateAction}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_entite}"/>
                    <h:outputText value="#{not empty historiqueController.selected.entite ? historiqueController.selected.entite : '—'}" title="#{bundle.ViewHistoriqueTitle_entite}" />
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_entiteId}"/>
                    <h:outputText value="#{bundle.ViewHistoriqueLabel_utilisateurId}"/>
                    <h:outputText value="#{not empty historiqueController.selected.utilisateurId ? historiqueController.selected.utilisateurId.nom : '—'}" title="#{bundle.ViewHistoriqueTitle_utilisateurId}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{historiqueController.destroyAndView}" value="#{bundle.ViewHistoriqueDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewHistoriqueEditLink}"/>
                <br />
                <h:commandLink action="#{historiqueController.prepareCreate}" value="#{bundle.ViewHistoriqueCreateLink}" />
                <br />
                <h:commandLink action="#{historiqueController.prepareList}" value="#{bundle.ViewHistoriqueShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>

</html>
