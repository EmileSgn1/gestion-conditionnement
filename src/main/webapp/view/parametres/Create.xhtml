<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateParametresTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateParametresLabel_cle}" for="cle" />
                    <h:inputText id="cle" value="#{parametresController.selected.cle}" title="#{bundle.CreateParametresTitle_cle}" required="true" requiredMessage="#{bundle.CreateParametresRequiredMessage_cle}"/>
                    <h:outputLabel value="#{bundle.CreateParametresLabel_valeur}" for="valeur" />
                    <h:inputText id="valeur" value="#{parametresController.selected.valeur}" title="#{bundle.CreateParametresTitle_valeur}" required="true" requiredMessage="#{bundle.CreateParametresRequiredMessage_valeur}"/>
                    <h:outputLabel value="#{bundle.CreateParametresLabel_description}" for="description" />
                    <h:inputText id="description" value="#{parametresController.selected.description}" title="#{bundle.CreateParametresTitle_description}" />
                </h:panelGrid>
                <br />
                <h:commandLink action="#{parametresController.create}" value="#{bundle.CreateParametresSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{parametresController.prepareList}" value="#{bundle.CreateParametresShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
