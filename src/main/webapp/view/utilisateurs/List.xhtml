<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListUtilisateursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar"><h:commandLink action="#{utilisateursController.prepareCreate}" value="#{bundle.ListUtilisateursCreateLink}" styleClass="btn-primary"/></div>
                <h:panelGroup layout="block" styleClass="empty-state" rendered="#{utilisateursController.items.rowCount == 0}"><h:outputText escape="false" value="#{bundle.ListUtilisateursEmpty}"/></h:panelGroup>
                <h:panelGroup rendered="#{utilisateursController.items.rowCount > 0}">
                    <h:outputText value="Affichage de #{utilisateursController.pagination.pageFirstItem + 1} à #{utilisateursController.pagination.pageLastItem + 1} sur #{utilisateursController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{utilisateursController.previous}" value="#{bundle.Previous} #{utilisateursController.pagination.pageSize}" rendered="#{utilisateursController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{utilisateursController.next}" value="#{bundle.Next} #{utilisateursController.pagination.pageSize}" rendered="#{utilisateursController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{utilisateursController.items}" var="item" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" styleClass="modern-table">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_nom}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.nom ? item.nom : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_prenom}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.prenom ? item.prenom : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_email}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.email ? item.email : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_actif}"/>
                            </f:facet>
                            <h:outputText value="#{item.actif ? 'Oui' : 'Non'}" styleClass="#{item.actif ? 'status-pill status-positive' : 'status-pill status-neutral'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_dateCreation}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateCreation}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_role}"/>
                            </f:facet>
                            <h:outputText value="#{utilisateursController.libelleRole(item.role)}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Actions"/>
                            </f:facet>
                            <h:commandLink action="#{utilisateursController.prepareView}" value="#{bundle.ListUtilisateursViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{utilisateursController.prepareEdit}" value="#{bundle.ListUtilisateursEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{utilisateursController.destroy}" onclick="return confirm('Confirmer la suppression de cet élément ?');" value="#{bundle.ListUtilisateursDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
