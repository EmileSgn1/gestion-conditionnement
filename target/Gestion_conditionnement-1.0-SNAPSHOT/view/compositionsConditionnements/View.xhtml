<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewCompositionsConditionnementsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewCompositionsConditionnementsLabel_articleId}"/>
                    <h:outputText value="#{articlesController.libellePourId(compositionsConditionnementsController.selected.articleId)}" title="#{bundle.ViewCompositionsConditionnementsTitle_articleId}"/>
                    <h:outputText value="#{bundle.ViewCompositionsConditionnementsLabel_conditionnementDepartId}"/>
                    <h:outputText value="#{conditionnementsController.libellePourId(compositionsConditionnementsController.selected.conditionnementDepartId)}" title="#{bundle.ViewCompositionsConditionnementsTitle_conditionnementDepartId}"/>
                    <h:outputText value="#{bundle.ViewCompositionsConditionnementsLabel_conditionnementObtenuId}"/>

                    <h:outputText value="#{bundle.ViewCompositionsConditionnementsLabel_quantiteTheorique}"/>
                    <h:outputText value="#{not empty compositionsConditionnementsController.selected.quantiteTheorique ? compositionsConditionnementsController.selected.quantiteTheorique : '—'}" title="#{bundle.ViewCompositionsConditionnementsTitle_quantiteTheorique}" />
                    <h:outputText value="#{bundle.ViewCompositionsConditionnementsLabel_actif}"/>
                    <h:outputText value="#{compositionsConditionnementsController.selected.actif ? 'Oui' : 'Non'}" title="#{bundle.ViewCompositionsConditionnementsTitle_actif}"/>

                <h:commandLink action="#{compositionsConditionnementsController.destroyAndView}" value="#{bundle.ViewCompositionsConditionnementsDestroyLink}"/>

                <br />
                <h:link outcome="Edit" value="#{bundle.ViewCompositionsConditionnementsEditLink}"/>
                <br />
                <h:commandLink action="#{compositionsConditionnementsController.prepareCreate}" value="#{bundle.ViewCompositionsConditionnementsCreateLink}" />
                <br />
                <h:commandLink action="#{compositionsConditionnementsController.prepareList}" value="#{bundle.ViewCompositionsConditionnementsShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>
