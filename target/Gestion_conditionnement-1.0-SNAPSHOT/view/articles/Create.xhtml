<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateArticlesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_reference}" for="reference" />
                    <h:inputText id="reference" value="#{articlesController.selected.reference}" title="#{bundle.CreateArticlesTitle_reference}" required="true" requiredMessage="#{bundle.CreateArticlesRequiredMessage_reference}"/>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{articlesController.selected.nom}" title="#{bundle.CreateArticlesTitle_nom}" required="true" requiredMessage="#{bundle.CreateArticlesRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_description}" for="description" />
                    <h:inputText id="description" value="#{articlesController.selected.description}" title="#{bundle.CreateArticlesTitle_description}" />
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox id="actif" value="#{articlesController.selected.actif}"/>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_prix}" for="prix" />
                    <h:inputText id="prix" value="#{articlesController.selected.prix}" title="#{bundle.CreateArticlesTitle_prix}" required="true" requiredMessage="#{bundle.CreateArticlesRequiredMessage_prix}"/>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_stockMin}" for="stockMin" />
                    <h:inputText id="stockMin" value="#{articlesController.selected.stockMin}" title="#{bundle.CreateArticlesTitle_stockMin}" required="true" requiredMessage="#{bundle.CreateArticlesRequiredMessage_stockMin}"/>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_categorieId}" for="categorieId" />
                    <h:selectOneMenu id="categorieId" value="#{articlesController.selected.categorieId}" title="#{bundle.CreateArticlesTitle_categorieId}"  converter="#{categoriesController.converter}">
                        <f:selectItems value="#{categoriesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateArticlesLabel_uniteId}" for="uniteId" />
                    <h:selectOneMenu id="uniteId" value="#{articlesController.selected.uniteId}" title="#{bundle.CreateArticlesTitle_uniteId}"  converter="#{unitesController.converter}">
                        <f:selectItems value="#{unitesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{articlesController.create}" value="#{bundle.CreateArticlesSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{articlesController.prepareList}" value="#{bundle.CreateArticlesShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
