<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListArticleConditionnementsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar"><h:commandLink action="#{articleConditionnementsController.prepareCreate}" value="#{bundle.ListArticleConditionnementsCreateLink}" styleClass="btn-primary"/></div>
                <h:panelGroup layout="block" styleClass="empty-state" rendered="#{articleConditionnementsController.items.rowCount == 0}"><h:outputText escape="false" value="#{bundle.ListArticleConditionnementsEmpty}"/></h:panelGroup>
                <h:panelGroup rendered="#{articleConditionnementsController.items.rowCount > 0}">
                    <h:outputText value="Affichage de #{articleConditionnementsController.pagination.pageFirstItem + 1} à #{articleConditionnementsController.pagination.pageLastItem + 1} sur #{articleConditionnementsController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{articleConditionnementsController.previous}" value="#{bundle.Previous} #{articleConditionnementsController.pagination.pageSize}" rendered="#{articleConditionnementsController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{articleConditionnementsController.next}" value="#{bundle.Next} #{articleConditionnementsController.pagination.pageSize}" rendered="#{articleConditionnementsController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{articleConditionnementsController.items}" var="item" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" styleClass="modern-table">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_quantiteParUnite}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.quantiteParUnite ? item.quantiteParUnite : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_stockConditionne}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.stockConditionne ? item.stockConditionne : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_seuilAlerte}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.seuilAlerte ? item.seuilAlerte : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_actif}"/>
                            </f:facet>
                            <h:outputText value="#{item.actif ? 'Oui' : 'Non'}" styleClass="#{item.actif ? 'status-pill status-positive' : 'status-pill status-neutral'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_articleId}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.articleId ? item.articleId.nom : '—'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListArticleConditionnementsTitle_conditionnementId}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.conditionnementId ? item.conditionnementId.designation : '—'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Actions"/>
                            </f:facet>
                            <h:commandLink action="#{articleConditionnementsController.prepareView}" value="#{bundle.ListArticleConditionnementsViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{articleConditionnementsController.prepareEdit}" value="#{bundle.ListArticleConditionnementsEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{articleConditionnementsController.destroy}" onclick="return confirm('Confirmer la suppression de cet élément ?');" value="#{bundle.ListArticleConditionnementsDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
