<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewRolesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewRolesLabel_nom}"/>
                    <h:outputText value="#{not empty rolesController.selected.nom ? rolesController.selected.nom : '—'}" title="#{bundle.ViewRolesTitle_nom}" />
                    <h:outputText value="#{bundle.ViewRolesLabel_description}"/>
                    <h:outputText value="#{not empty rolesController.selected.description ? rolesController.selected.description : '—'}" title="#{bundle.ViewRolesTitle_description}" />
                </h:panelGrid>
                <br />
                <h:commandLink action="#{rolesController.destroyAndView}" value="#{bundle.ViewRolesDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewRolesEditLink}"/>
                <br />
                <h:commandLink action="#{rolesController.prepareCreate}" value="#{bundle.ViewRolesCreateLink}" />
                <br />
                <h:commandLink action="#{rolesController.prepareList}" value="#{bundle.ViewRolesShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>

</html>
