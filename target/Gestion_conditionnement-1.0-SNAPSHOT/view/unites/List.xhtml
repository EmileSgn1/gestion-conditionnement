<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListUnitesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
                </h:panelGroup>
                <div class="list-toolbar"><h:commandLink action="#{unitesController.prepareCreate}" value="#{bundle.ListUnitesCreateLink}" styleClass="btn-primary"/></div>
                <h:panelGroup layout="block" styleClass="empty-state" rendered="#{unitesController.items.rowCount == 0}"><h:outputText escape="false" value="#{bundle.ListUnitesEmpty}"/></h:panelGroup>
                <h:panelGroup rendered="#{unitesController.items.rowCount > 0}">
                    <h:outputText value="Affichage de #{unitesController.pagination.pageFirstItem + 1} à #{unitesController.pagination.pageLastItem + 1} sur #{unitesController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{unitesController.previous}" value="#{bundle.Previous} #{unitesController.pagination.pageSize}" rendered="#{unitesController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{unitesController.next}" value="#{bundle.Next} #{unitesController.pagination.pageSize}" rendered="#{unitesController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{unitesController.items}" var="item" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" styleClass="modern-table">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUnitesTitle_code}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.code ? item.code : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUnitesTitle_sigle}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.sigle ? item.sigle : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUnitesTitle_libelle}"/>
                            </f:facet>
                            <h:outputText value="#{not empty item.libelle ? item.libelle : '—'}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUnitesTitle_actif}"/>
                            </f:facet>
                            <h:outputText value="#{item.actif ? 'Oui' : 'Non'}" styleClass="#{item.actif ? 'status-pill status-positive' : 'status-pill status-neutral'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Actions"/>
                            </f:facet>
                            <h:commandLink action="#{unitesController.prepareView}" value="#{bundle.ListUnitesViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{unitesController.prepareEdit}" value="#{bundle.ListUnitesEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{unitesController.destroy}" onclick="return confirm('Confirmer la suppression de cet élément ?');" value="#{bundle.ListUnitesDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
