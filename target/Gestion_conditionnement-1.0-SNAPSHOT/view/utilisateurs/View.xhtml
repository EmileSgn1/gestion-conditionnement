<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewUtilisateursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_nom}"/>
                    <h:outputText value="#{not empty utilisateursController.selected.nom ? utilisateursController.selected.nom : '—'}" title="#{bundle.ViewUtilisateursTitle_nom}" />
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_prenom}"/>
                    <h:outputText value="#{not empty utilisateursController.selected.prenom ? utilisateursController.selected.prenom : '—'}" title="#{bundle.ViewUtilisateursTitle_prenom}" />
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_email}"/>
                    <h:outputText value="#{not empty utilisateursController.selected.email ? utilisateursController.selected.email : '—'}" title="#{bundle.ViewUtilisateursTitle_email}" />
                    <h:outputText value="Mot de passe"/>
                    <h:outputText value="Défini" rendered="#{not empty utilisateursController.selected.motDePasse}"/>
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_actif}"/>
                    <h:outputText value="#{utilisateursController.selected.actif ? 'Oui' : 'Non'}" title="#{bundle.ViewUtilisateursTitle_actif}"/>
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_dateCreation}"/>
                    <h:outputText value="#{utilisateursController.selected.dateCreation}" title="#{bundle.ViewUtilisateursTitle_dateCreation}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewUtilisateursLabel_role}"/>
                    <h:outputText value="#{utilisateursController.libelleRole(utilisateursController.selected.role)}" title="#{bundle.ViewUtilisateursTitle_role}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{utilisateursController.destroyAndView}" value="#{bundle.ViewUtilisateursDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewUtilisateursEditLink}"/>
                <br />
                <h:commandLink action="#{utilisateursController.prepareCreate}" value="#{bundle.ViewUtilisateursCreateLink}" />
                <br />
                <h:commandLink action="#{utilisateursController.prepareList}" value="#{bundle.ViewUtilisateursShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>

</html>
