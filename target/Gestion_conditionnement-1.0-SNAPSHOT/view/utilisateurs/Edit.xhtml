<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditUtilisateursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{utilisateursController.selected.nom}" title="#{bundle.EditUtilisateursTitle_nom}" required="true" requiredMessage="#{bundle.EditUtilisateursRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_prenom}" for="prenom" />
                    <h:inputText id="prenom" value="#{utilisateursController.selected.prenom}" title="#{bundle.EditUtilisateursTitle_prenom}" required="true" requiredMessage="#{bundle.EditUtilisateursRequiredMessage_prenom}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_email}" for="email" />
                    <h:inputText id="email" value="#{utilisateursController.selected.email}" title="#{bundle.EditUtilisateursTitle_email}" required="true" requiredMessage="#{bundle.EditUtilisateursRequiredMessage_email}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_motDePasse}" for="motDePasse" />
                    <h:inputSecret id="motDePasse" value="#{utilisateursController.selected.motDePasse}" title="#{bundle.EditUtilisateursTitle_motDePasse}" required="false" redisplay="false">
                        <f:passThroughAttribute name="autocomplete" value="new-password"/>
                    </h:inputSecret>
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox id="actif" value="#{utilisateursController.selected.actif}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateursLabel_role}" for="role" />
                    <h:selectOneMenu id="role" value="#{utilisateursController.selected.role}" title="#{bundle.EditUtilisateursTitle_role}" required="true" requiredMessage="#{bundle.EditUtilisateursRequiredMessage_role}">
                        <f:selectItems value="#{utilisateursController.rolesDisponibles}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{utilisateursController.update}" value="#{bundle.EditUtilisateursSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditUtilisateursViewLink}"/>
                <br />
                <h:commandLink action="#{utilisateursController.prepareList}" value="#{bundle.EditUtilisateursShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
