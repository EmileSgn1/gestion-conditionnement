<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateParametresApplicationTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateParametresApplicationLabel_cle}" for="cle" />
                    <h:inputText id="cle" value="#{parametresApplicationController.selected.cle}" title="#{bundle.CreateParametresApplicationTitle_cle}" required="true" requiredMessage="#{bundle.CreateParametresApplicationRequiredMessage_cle}"/>
                    <h:outputLabel value="#{bundle.CreateParametresApplicationLabel_valeur}" for="valeur" />
                    <h:inputText id="valeur" value="#{parametresApplicationController.selected.valeur}" title="#{bundle.CreateParametresApplicationTitle_valeur}" required="true" requiredMessage="#{bundle.CreateParametresApplicationRequiredMessage_valeur}"/>
                    <h:outputLabel value="#{bundle.CreateParametresApplicationLabel_description}" for="description" />
                    <h:inputText id="description" value="#{parametresApplicationController.selected.description}" title="#{bundle.CreateParametresApplicationTitle_description}" />
                </h:panelGrid>
                <br />
                <h:commandLink action="#{parametresApplicationController.create}" value="#{bundle.CreateParametresApplicationSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{parametresApplicationController.prepareList}" value="#{bundle.CreateParametresApplicationShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
