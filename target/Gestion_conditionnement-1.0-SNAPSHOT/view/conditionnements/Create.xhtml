<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateConditionnementsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_quantiteBase}" for="quantiteBase" />
                    <h:inputText id="quantiteBase" value="#{conditionnementsController.selected.quantiteBase}" title="#{bundle.CreateConditionnementsTitle_quantiteBase}" />
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_coefficient}" for="coefficient" />
                    <h:inputText id="coefficient" value="#{conditionnementsController.selected.coefficient}" title="#{bundle.CreateConditionnementsTitle_coefficient}" required="true" requiredMessage="#{bundle.CreateConditionnementsRequiredMessage_coefficient}"/>
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox id="actif" value="#{conditionnementsController.selected.actif}"/>
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_articleId}" for="articleId" />
                    <h:selectOneMenu id="articleId" value="#{conditionnementsController.selected.articleId}" title="#{bundle.CreateConditionnementsTitle_articleId}"  converter="#{articlesController.converter}">
                        <f:selectItems value="#{articlesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_articleSourceId}" for="articleSourceId" />
                    <h:selectOneMenu id="articleSourceId" value="#{conditionnementsController.selected.articleSourceId}" title="#{bundle.CreateConditionnementsTitle_articleSourceId}"  converter="#{articlesController.converter}">
                        <f:selectItems value="#{articlesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateConditionnementsLabel_typeConditionnementId}" for="typeConditionnementId" />
                    <h:selectOneMenu id="typeConditionnementId" value="#{conditionnementsController.selected.typeConditionnementId}" title="#{bundle.CreateConditionnementsTitle_typeConditionnementId}"  converter="#{typesConditionnementController.converter}">
                        <f:selectItems value="#{typesConditionnementController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{conditionnementsController.create}" value="#{bundle.CreateConditionnementsSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{conditionnementsController.prepareList}" value="#{bundle.CreateConditionnementsShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
