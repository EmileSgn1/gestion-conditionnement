<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewHistoriqueActionsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    
                    <h:outputText value="#{bundle.ViewHistoriqueActionsLabel_utilisateurId}"/>
                    <h:outputText value="#{utilisateursController.libellePourId(historiqueActionsController.selected.utilisateurId)}" title="#{bundle.ViewHistoriqueActionsTitle_utilisateurId}"/>
                    <h:outputText value="#{bundle.ViewHistoriqueActionsLabel_action}"/>
                    <h:outputText value="#{not empty historiqueActionsController.selected.action ? historiqueActionsController.selected.action : '—'}" title="#{bundle.ViewHistoriqueActionsTitle_action}" />
                    <h:outputText value="#{bundle.ViewHistoriqueActionsLabel_details}"/>
                    <h:outputText value="#{not empty historiqueActionsController.selected.details ? historiqueActionsController.selected.details : '—'}" title="#{bundle.ViewHistoriqueActionsTitle_details}" />
                    <h:outputText value="#{bundle.ViewHistoriqueActionsLabel_adresseIp}"/>
                    <h:outputText value="#{not empty historiqueActionsController.selected.adresseIp ? historiqueActionsController.selected.adresseIp : '—'}" title="#{bundle.ViewHistoriqueActionsTitle_adresseIp}" />
                    <h:outputText value="#{bundle.ViewHistoriqueActionsLabel_dateAction}"/>
                    <h:outputText value="#{historiqueActionsController.selected.dateAction}" title="#{bundle.ViewHistoriqueActionsTitle_dateAction}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{historiqueActionsController.destroyAndView}" value="#{bundle.ViewHistoriqueActionsDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewHistoriqueActionsEditLink}"/>
                <br />
                <h:commandLink action="#{historiqueActionsController.prepareCreate}" value="#{bundle.ViewHistoriqueActionsCreateLink}" />
                <br />
                <h:commandLink action="#{historiqueActionsController.prepareList}" value="#{bundle.ViewHistoriqueActionsShowAllLink}"/>
                <br />
                <br />

            </h:form>
        </ui:define>
    </ui:composition>

</html>
