<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
    <ui:composition template="../../template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateNotificationsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="message-error" infoClass="message-success" warnClass="message-warning" fatalClass="message-error" styleClass="app-messages" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel value="#{bundle.CreateNotificationsLabel_utilisateurId}" for="utilisateurId" />
                    <h:selectOneMenu id="utilisateurId" value="#{notificationsController.selected.utilisateurId}" converter="#{notificationsController.converter}"><f:selectItems value="#{utilisateursController.itemsAvailableSelectOneByIdBigInteger}" /></h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateNotificationsLabel_titre}" for="titre" />
                    <h:inputText id="titre" value="#{notificationsController.selected.titre}" title="#{bundle.CreateNotificationsTitle_titre}" required="true" requiredMessage="#{bundle.CreateNotificationsRequiredMessage_titre}"/>
                    <h:outputLabel value="#{bundle.CreateNotificationsLabel_message}" for="message" />
                    <h:inputText id="message" value="#{notificationsController.selected.message}" title="#{bundle.CreateNotificationsTitle_message}" required="true" requiredMessage="#{bundle.CreateNotificationsRequiredMessage_message}"/>
                    <h:outputLabel value="#{bundle.CreateNotificationsLabel_typeNotification}" for="typeNotification" />
                    <h:inputText id="typeNotification" value="#{notificationsController.selected.typeNotification}" title="#{bundle.CreateNotificationsTitle_typeNotification}" required="true" requiredMessage="#{bundle.CreateNotificationsRequiredMessage_typeNotification}"/>
                    <h:outputLabel value="#{bundle.CreateNotificationsLabel_lue}" for="lue" />
                    <h:selectBooleanCheckbox id="lue" value="#{notificationsController.selected.lue}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{notificationsController.create}" value="#{bundle.CreateNotificationsSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{notificationsController.prepareList}" value="#{bundle.CreateNotificationsShowAllLink}" immediate="true"/>
                <br />
                <br />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
